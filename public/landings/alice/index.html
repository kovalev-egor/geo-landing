<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alice</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      color: #2a2438;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .bg {
      position: fixed;
      inset: -32px;
      background:
        linear-gradient(180deg, rgba(88, 62, 120, 0.18), rgba(40, 24, 58, 0.28)),
        url("/landings/alice/images/alice.jpg") center 30% / cover no-repeat;
      filter: blur(22px) saturate(1.05);
      transform: scale(1.08);
    }
    main {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      gap: clamp(12px, 3vh, 28px);
    }
    .frame {
      width: min(420px, 100%);
      max-width: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 3vh, 28px);
    }
    .stage {
      width: 100%;
      max-width: 100%;
    }
    .aura {
      position: relative;
      margin-top: clamp(40px, 12vw, 58px);
      padding: clamp(62px, 18vw, 82px) clamp(10px, 3vw, 16px) clamp(12px, 3vw, 18px);
      border-radius: clamp(24px, 8vw, 36px);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.45), transparent 18%),
        radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.28), transparent 16%),
        linear-gradient(180deg, #d7c6ff 0%, #c4b0fb 48%, #bba4f6 100%);
      box-shadow: 0 18px 40px rgba(74, 42, 120, 0.18);
    }
    .cloud, .star {
      position: absolute;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }
    .cloud-a { top: 14px; left: 14px; width: clamp(36px, 12vw, 54px); height: auto; }
    .cloud-b { right: 16px; bottom: 12px; width: clamp(32px, 10vw, 46px); height: auto; }
    .star-a { top: 22px; right: 46px; }
    .star-b { top: 52px; left: 22px; font-size: 11px; }
    .star-c { right: 28px; bottom: 46px; font-size: 13px; }
    .card {
      position: relative;
      background: #fff;
      border-radius: clamp(20px, 7vw, 28px);
      padding: clamp(58px, 16vw, 78px) clamp(12px, 4vw, 22px) clamp(16px, 4vw, 26px);
      text-align: center;
      box-shadow: 0 10px 24px rgba(90, 60, 140, 0.08);
    }
    .avatar {
      position: absolute;
      top: clamp(-48px, -14vw, -62px);
      left: 50%;
      width: clamp(92px, 28vw, 118px);
      height: clamp(92px, 28vw, 118px);
      transform: translateX(-50%);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 16%;
      border: clamp(3px, 1vw, 5px) solid #fff;
      box-shadow: 0 0 0 clamp(3px, 1vw, 5px) #c9b6ff;
      background: #efe8ff;
    }
    .online {
      position: absolute;
      right: 4px;
      bottom: 6px;
      width: clamp(16px, 5vw, 22px);
      height: clamp(16px, 5vw, 22px);
      border-radius: 50%;
      background: #2fce5a;
      border: 3px solid #fff;
    }
    h1 {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      margin: 0;
      color: #7a4dff;
      font-family: "Great Vibes", "Segoe Script", cursive;
      font-size: clamp(46px, 15vw, 68px);
      font-weight: 400;
      line-height: 0.9;
    }
    .emoji { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; font-size: clamp(22px, 7vw, 28px); letter-spacing: 0; line-height: 1; }
    .verified {
      display: inline-flex;
      width: clamp(18px, 5vw, 22px);
      height: clamp(18px, 5vw, 22px);
      border-radius: 50%;
      background: #2f9cf5;
      color: #fff;
      align-items: center;
      justify-content: center;
    }
    .hint {
      margin: clamp(8px, 2vh, 14px) 0 0;
      color: #8d8798;
      font-size: clamp(16px, 4.6vw, 20px);
    }
    .cta {
      width: 100%;
      max-width: 100%;
      margin-top: clamp(12px, 2.4vh, 18px);
      border: 0;
      border-radius: 999px;
      background: #f7b7c9;
      color: #1d1a22;
      min-height: clamp(56px, 16vw, 74px);
      padding: 10px 16px 10px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 3vw, 14px);
      font: 700 clamp(16px, 4.8vw, 22px)/1.15 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(180, 90, 120, 0.16);
      -webkit-tap-highlight-color: transparent;
    }
    .cta:disabled { opacity: 0.7; cursor: default; }
    .label { min-width: 0; text-wrap: balance; }
    .mark {
      width: clamp(40px, 12vw, 48px);
      height: clamp(40px, 12vw, 48px);
      flex: 0 0 auto;
      border-radius: 50%;
      background: #3f93f8;
      color: #fff;
      display: grid;
      place-items: center;
    }
    .mark svg { width: 46%; height: 46%; }
    .where {
      margin: clamp(10px, 2vh, 18px) auto 0;
      max-width: 100%;
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(42, 36, 48, 0.55);
      color: #fff;
      font-size: clamp(14px, 4vw, 16px);
      overflow-wrap: anywhere;
    }
    .legal {
      width: min(320px, 100%);
      margin: 0;
      text-align: center;
      color: #d7c4ff;
      font-size: clamp(13px, 3.6vw, 15px);
      line-height: 1.45;
      text-shadow: 0 1px 8px rgba(40, 20, 70, 0.35);
    }
    .track-status {
      margin: 10px 0 0;
      text-align: center;
      color: #fff;
      font-size: 14px;
    }
    @media (max-height: 700px) {
      main, .frame { gap: 10px; }
      .aura { margin-top: 36px; padding-top: 54px; padding-bottom: 10px; }
      .card { padding-top: 48px; padding-bottom: 14px; }
      .avatar { top: -40px; width: 84px; height: 84px; }
      h1 { font-size: clamp(40px, 12vw, 52px); }
      .hint { margin-top: 6px; }
      .cta { min-height: 52px; margin-top: 10px; }
      .where { margin-top: 8px; }
    }
    @media (max-height: 430px) {
      main, .frame { gap: 8px; }
      .aura { margin-top: 26px; padding-top: 42px; padding-bottom: 8px; }
      .card { padding-top: 36px; padding-bottom: 10px; }
      .avatar { top: -30px; width: 64px; height: 64px; }
      h1 { font-size: 36px; }
      .hint { margin-top: 2px; font-size: 14px; }
      .cta { min-height: 48px; margin-top: 8px; }
      .where { margin-top: 6px; }
    }
    @media (max-width: 340px) {
      .star-a, .star-b { display: none; }
    }
  </style>
</head>
<body data-landing-id="{{landing_id}}" data-variant="{{variant}}" data-country="{{country}}" data-region="{{region}}" data-city="{{city}}" data-offer-id="{{offer_id}}" data-offer-url="{{offer_url}}">
  {{preview}}
  <div class="bg" aria-hidden="true"></div>
  <main>
    <div class="frame">
    <section class="stage">
      <div class="aura">
        <svg class="cloud cloud-a" width="54" height="32" viewBox="0 0 54 32" aria-hidden="true"><path fill="currentColor" d="M14 28h26a10 10 0 0 0 1.6-19.9A12 12 0 0 0 18.2 6 9 9 0 0 0 8 14.2 8 8 0 0 0 14 28z"/></svg>
        <svg class="cloud cloud-b" width="54" height="32" viewBox="0 0 54 32" aria-hidden="true"><path fill="currentColor" d="M14 28h26a10 10 0 0 0 1.6-19.9A12 12 0 0 0 18.2 6 9 9 0 0 0 8 14.2 8 8 0 0 0 14 28z"/></svg>
        <span class="star star-a" aria-hidden="true">✦</span>
        <span class="star star-b" aria-hidden="true">✧</span>
        <span class="star star-c" aria-hidden="true">✦</span>
        <article class="card">
          <div class="avatar">
            <img src="/landings/alice/images/alice.jpg" alt="Alice">
            <span class="online" aria-hidden="true"></span>
          </div>
          <h1>Alice <span class="emoji">😍❤️</span> <span class="verified" aria-label="Verified"><svg width="12" height="12" viewBox="0 0 12 12"><path fill="currentColor" d="M4.6 8.6 2.1 6.1l1-1 1.5 1.5 4.3-4.3 1 1z"/></svg></span></h1>
          <p class="hint">Catch me here ↓</p>
        </article>
      </div>
      <button class="cta" type="button" data-track="cta" data-done="{{done}}">
        <span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-6.7-4.2-9.3-8.2C.8 10.2 1.2 6.6 4.2 5.3 6.2 4.4 8.2 5 9.4 6.4L12 9.2l2.6-2.8c1.2-1.4 3.2-2 5.2-1.1 3 1.3 3.4 4.9 1.5 7.5C18.7 16.8 12 21 12 21z"/></svg></span>
        <span class="label">{{cta}}</span>
      </button>
      <p class="where"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg> {{place}}</p>
    </section>
    <p class="legal">Условия использования · Политика конфиденциальности · Пожаловаться</p>
    </div>
  </main>
  <script src="/js/track.js" defer></script>
</body>
</html>
