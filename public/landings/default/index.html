<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headline}} — Waypoint</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/landing.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0e1520;
      color: #d5deea;
      font-family: "Segoe UI", sans-serif;
    }
    header { display: flex; justify-content: space-between; padding: 22px 28px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto 72px; }
    .eyebrow { margin: 12px 0; color: #7eb6ff; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 16ch; font-weight: 560; font-size: clamp(42px, 7vw, 76px); line-height: 0.95; letter-spacing: -0.045em; }
    .rule { width: 72px; height: 2px; background: #7eb6ff; margin: 22px 0; }
    .lede { max-width: 38rem; font-size: 19px; line-height: 1.5; color: #b7c3d1; }
    .cta { border: 0; background: #7eb6ff; color: #0e1520; padding: 14px 22px; font-size: 16px; cursor: pointer; }
    .proof { color: #8ea0b5; font-size: 14px; }
    .media { margin-top: 36px; border: 1px solid #243044; }
    .media img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; }
    @media (max-width: 700px) {
      header, main { padding-left: 0; }
      main { width: min(920px, calc(100% - 32px)); }
    }
  </style>
</head>
<body data-landing-id="{{landing_id}}" data-variant="{{variant}}" data-country="{{country}}" data-region="{{region}}" data-city="{{city}}">
  {{preview}}
  <header>
    <span>Waypoint</span>
    <span>On foot</span>
  </header>
  <main>
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <div class="rule"></div>
    <p class="lede">{{subheadline}}</p>
    <button class="cta" type="button" data-track="cta" data-done="{{done}}">{{cta}}</button>
    <p class="proof">{{proof}}</p>
    <div class="media"><img src="{{hero}}" alt=""></div>
  </main>
  <script src="/js/track.js" defer></script>
</body>
</html>
