<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headline}} — Northline</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/landing.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #14211b;
      color: #efe7d6;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    }
    .split { display: grid; grid-template-columns: 1.05fr 0.95fr; min-height: 100vh; }
    .copy { padding: 48px 48px 64px; display: flex; flex-direction: column; justify-content: center; }
    .brand { margin: 0 0 28px; letter-spacing: 0.16em; text-transform: uppercase; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    .eyebrow { margin: 0 0 12px; color: #d6ff4a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 0.96; letter-spacing: -0.03em; }
    .lede { max-width: 38rem; font-size: 20px; line-height: 1.45; color: #d5d0c2; }
    .cta { margin-top: 8px; align-self: flex-start; border: 0; background: #d6ff4a; color: #14211b; padding: 14px 22px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; cursor: pointer; }
    .proof { margin: 18px 0 0; color: #b7c3b4; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
    .media { background: #0e1914; min-height: 320px; }
    .media img { width: 100%; height: 100%; object-fit: cover; min-height: 320px; }
    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; }
      .copy { padding: 28px 20px 48px; }
      .media { order: -1; }
    }
  </style>
</head>
<body data-landing-id="{{landing_id}}" data-variant="{{variant}}" data-country="{{country}}" data-region="{{region}}" data-city="{{city}}" data-offer-id="{{offer_id}}" data-offer-url="{{offer_url}}">
  {{preview}}
  <main class="split">
    <section class="copy">
      <p class="brand">Northline</p>
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{headline}}</h1>
      <p class="lede">{{subheadline}}</p>
      <button class="cta" type="button" data-track="cta" data-done="{{done}}">{{cta}}</button>
      <p class="proof">{{proof}}</p>
    </section>
    <section class="media">
      <img src="{{hero}}" alt="">
    </section>
  </main>
  <script src="/js/track.js" defer></script>
</body>
</html>
