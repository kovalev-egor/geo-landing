<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headline}} — Atelier Sol</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/landing.css">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f3efe7;
      color: #2a2118;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    main { min-height: 100vh; display: grid; place-items: center; padding: 48px 20px 64px; }
    .card { width: min(640px, 100%); text-align: center; }
    .brand { margin: 0; font-family: Georgia, "Iowan Old Style", serif; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; }
    .since { margin: 6px 0 22px; color: #8a8175; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
    .media { width: min(280px, 70vw); margin: 0 auto 28px; }
    .media img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; background: #e7d3c4; }
    .eyebrow { margin: 0 0 10px; color: #b8432f; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: clamp(36px, 6vw, 58px); line-height: 1.02; letter-spacing: -0.03em; }
    .lede { font-size: 18px; line-height: 1.5; color: #4d453c; }
    .cta { border: 0; background: #b8432f; color: #fffaf6; padding: 14px 22px; font-size: 16px; cursor: pointer; }
    .proof { margin: 16px 0 0; color: #6d655c; font-size: 14px; }
  </style>
</head>
<body data-landing-id="{{landing_id}}" data-variant="{{variant}}" data-country="{{country}}" data-region="{{region}}" data-city="{{city}}">
  {{preview}}
  <main>
    <article class="card">
      <p class="brand">Atelier Sol</p>
      <p class="since">Studio hours</p>
      <div class="media"><img src="{{hero}}" alt=""></div>
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{headline}}</h1>
      <p class="lede">{{subheadline}}</p>
      <button class="cta" type="button" data-track="cta" data-done="{{done}}">{{cta}}</button>
      <p class="proof">{{proof}}</p>
    </article>
  </main>
  <script src="/js/track.js" defer></script>
</body>
</html>
