<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Girls live now — sexymeet</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/sexymeet.css?v=4">
</head>
<body data-landing-id="{{landing_id}}" data-variant="{{variant}}" data-country="{{country}}" data-region="{{region}}" data-city="{{city}}" data-offer-id="{{offer_id}}" data-offer-url="{{offer_url}}">
  {{preview}}
  <main class="screen">
    <header class="livebar">
      <span class="dot pulse"></span>
      <strong><span data-girls>18</span> girls online now</strong>
      <span class="timer" data-wait>1:12</span>
    </header>
    <p class="warn">Don't keep her waiting.</p>
    <div class="stage">
      <img src="/media/sexymeet/mia.jpg" alt="Mia is live">
      <div class="faces" aria-hidden="true">
        <img src="/media/sexymeet/alice.jpg" alt="">
        <img src="/media/sexymeet/lena.jpg" alt="">
        <img src="/media/sexymeet/sofia.jpg" alt="">
      </div>
    </div>
    <section class="stack">
      <span class="badge">Claim free tokens</span>
      <button class="cta" type="button" data-track="cta" data-done="{{done}}">Join her private room</button>
      <p class="fine">Free tokens on signup · {{place}}</p>
    </section>
  </main>
  <script src="/js/sexymeet.js" defer></script>
  <script src="/js/track.js" defer></script>
</body>
</html>
